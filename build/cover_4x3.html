<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{width:1200px;height:900px;overflow:hidden;position:relative;
    background:#07060d;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#f4eefb;}
  .sky{position:absolute;inset:0;background:
    radial-gradient(70% 60% at 78% 30%, rgba(255,176,138,.30), transparent 62%),
    radial-gradient(60% 55% at 18% 78%, rgba(138,182,255,.24), transparent 65%),
    radial-gradient(50% 45% at 50% 110%, rgba(255,158,199,.20), transparent 70%),
    linear-gradient(160deg,#12101f 0%,#07060d 55%,#0b0916 100%);}
  .grid{position:absolute;inset:0;opacity:.16;
    background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(70% 70% at 50% 55%,#000 20%,transparent 78%);
    -webkit-mask-image:radial-gradient(70% 70% at 50% 55%,#000 20%,transparent 78%);}
  .vign{position:absolute;inset:0;background:radial-gradient(75% 70% at 50% 45%,transparent 40%,rgba(0,0,0,.72) 100%);}
  .rays{position:absolute;right:-160px;top:-180px;width:900px;height:900px;transform:rotate(-18deg);
    background:linear-gradient(115deg, rgba(255,209,102,.16) 0%, rgba(255,158,199,.10) 38%, transparent 62%);
    filter:blur(30px);opacity:.75;}

  .wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 76px 0 84px;gap:20px;}
  .left{flex:1 1 auto;max-width:660px;}

  .kicker{display:inline-flex;align-items:center;gap:10px;font-size:17px;letter-spacing:.34em;
    color:#ffd166;text-transform:uppercase;margin-bottom:22px;}
  .kicker i{display:block;width:34px;height:2px;background:linear-gradient(90deg,#ffd166,transparent);}

  h1{font-size:86px;line-height:1.06;font-weight:900;letter-spacing:.01em;
    background:linear-gradient(120deg,#fff 8%,#ffe6a8 42%,#ffb08a 66%,#ff9ec7 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 60px rgba(255,176,138,.28);}
  .sub{margin-top:20px;font-size:22px;letter-spacing:.30em;color:#bfb2d8;}

  .tags{display:flex;gap:12px;margin-top:34px;flex-wrap:wrap;}
  .tag{padding:11px 20px;border-radius:999px;font-size:17px;letter-spacing:.06em;
    border:1px solid rgba(255,255,255,.20);background:rgba(255,255,255,.06);color:#e6ddf6;}
  .tag b{color:#fff;font-weight:800;}
  .tag.e{border-color:rgba(126,232,208,.55);color:#bff5ea;}
  .tag.n{border-color:rgba(255,209,102,.55);color:#ffe6a8;}
  .tag.h{border-color:rgba(255,158,199,.55);color:#ffd0e2;}

  .keys{display:flex;gap:14px;margin-top:40px;align-items:center;}
  .kbd{width:74px;height:74px;border-radius:18px;display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:800;letter-spacing:.02em;
    background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
    border:1px solid rgba(255,255,255,.26);
    box-shadow:0 10px 26px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);}
  .kbd:nth-child(1){color:#7ee8d0;border-color:rgba(126,232,208,.5);}
  .kbd:nth-child(2){color:#ffd166;border-color:rgba(255,209,102,.5);}
  .kbd:nth-child(3){color:#ff9ec7;border-color:rgba(255,158,199,.5);}
  .kbd:nth-child(4){color:#8ab6ff;border-color:rgba(138,182,255,.5);}
  .keys span{margin-left:8px;font-size:16px;color:#9d90b8;letter-spacing:.12em;}

  .right{position:relative;width:420px;height:100%;flex:0 0 420px;}
  .halo{position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle,rgba(255,209,102,.30),rgba(255,158,199,.14) 45%,transparent 70%);
    filter:blur(6px);}
  .ring{position:absolute;left:50%;top:50%;width:400px;height:400px;transform:translate(-50%,-50%);
    border-radius:50%;border:1px dashed rgba(255,255,255,.16);}
  .cat-art{position:absolute;left:50%;top:50%;width:400px;transform:translate(-50%,-52%);
    filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));}
  .cat-art svg{width:100%;height:auto;display:block;}

  .foot{position:absolute;left:84px;bottom:46px;display:flex;gap:22px;align-items:center;
    font-size:15.5px;letter-spacing:.14em;color:#a99dc0;}
  .foot b{color:#c9bde3;font-weight:600;}
  .badge{position:absolute;right:76px;bottom:44px;padding:12px 22px;border-radius:14px;
    font-size:16px;letter-spacing:.18em;color:#0a0912;font-weight:800;
    background:linear-gradient(135deg,#ffd166,#ffb08a);
    box-shadow:0 12px 34px rgba(255,176,138,.35);}
  .glowline{position:absolute;left:0;right:0;bottom:0;height:6px;
    background:linear-gradient(90deg,#7ee8d0,#ffd166,#ff9ec7,#8ab6ff);opacity:.9;}
</style></head>
<body>
  <div class="sky"></div><div class="rays"></div><div class="grid"></div>
  <div class="wrap">
    <div class="left">
      <div class="kicker"><i></i>Rhythm Game</div>
      <h1>嘶恍而过的<br/>青葱岁月</h1>
      <div class="sub">4 键下落式 · 网页音游</div>
      <div class="tags">
        <span class="tag e">轻松 <b>135</b></span>
        <span class="tag n">心动 <b>252</b></span>
        <span class="tag h">青春 <b>463</b></span>
      </div>
      <div class="keys">
        <div class="kbd">D</div><div class="kbd">F</div><div class="kbd">J</div><div class="kbd">K</div>
        <span>键盘 / 触屏 / 手柄</span>
      </div>
    </div>
    <div class="right">
      <div class="halo"></div><div class="ring"></div>
      <div class="cat-art">
<svg class="cat" viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg" aria-label="哈士猫形象">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="65%" stop-color="#f4f1fa"/><stop offset="100%" stop-color="#dfd8ef"/>
    </linearGradient>
    <linearGradient id="furGray" x1="0.1" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#c2bfd2"/><stop offset="50%" stop-color="#9d9ab2"/><stop offset="100%" stop-color="#7c7991"/>
    </linearGradient>
    <linearGradient id="furGraySoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b4b1c6" stop-opacity=".95"/><stop offset="100%" stop-color="#8b88a2" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="iris" cx="36%" cy="30%" r="74%">
      <stop offset="0%" stop-color="#cdeeff"/><stop offset="40%" stop-color="#6fc1f7"/><stop offset="78%" stop-color="#2a76c4"/><stop offset="100%" stop-color="#123f75"/>
    </radialGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,.6)"/><stop offset="48%" stop-color="rgba(255,255,255,.05)"/><stop offset="100%" stop-color="rgba(255,255,255,.28)"/>
    </linearGradient>
    <linearGradient id="nose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffa7ba"/><stop offset="100%" stop-color="#e7748f"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff8f6b"/><stop offset="100%" stop-color="#e2534f"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.4"/></filter>
  </defs>

  <!-- 尾巴 -->
  <path d="M164 206c24 8 40 -6 38 -26 -2 -16 -15 -24 -27 -19" fill="none" stroke="url(#furGray)" stroke-width="15" stroke-linecap="round"/>
  <path d="M196 158c6 2 9 7 9 12" fill="none" stroke="#e9e4f5" stroke-width="9" stroke-linecap="round"/>

  <!-- 身体 -->
  <path d="M110 152c-32 0-56 20-60 46 -3 22 12 38 34 40h52c22-2 37-18 34-40 -4-26-28-46-60-46z" fill="url(#fur)"/>
  <!-- 身体灰斑（右侧） -->
  <path d="M148 168c16 10 24 26 25 42 1 12-5 22-15 26 8-24 2-50-10-68z" fill="url(#furGraySoft)"/>
  <path d="M70 172c-10 10-16 24-16 38 0 10 4 18 12 24 -8-22-5-44 4-62z" fill="url(#furGraySoft)" opacity=".55"/>
  <!-- 胸前绒毛 -->
  <path d="M110 168c-9 0-17 3-24 8 5 4 7 9 8 14 -8 3-14 9-16 17 10-7 19-7 27-1 2-6 3-11 5-15 2 4 3 9 5 15 8-6 17-6 27 1 -2-8-8-14-16-17 1-5 3-10 8-14 -7-5-15-8-24-8z" fill="#fffafd"/>
  <!-- 前爪 -->
  <ellipse cx="84" cy="234" rx="19" ry="12" fill="#fffafd"/>
  <ellipse cx="136" cy="234" rx="19" ry="12" fill="#fffafd"/>
  <path d="M76 234h14M130 234h14" stroke="#e6dff2" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 围巾 -->
  <path d="M78 156c9 9 20 14 32 14s23-5 32-14c4 6 6 13 6 19 -11 9-24 14-38 14s-27-5-38-14c0-6 2-13 6-19z" fill="url(#scarf)"/>
  <path d="M110 186c-4 6-6 14-6 22 0 7 2 12 6 16 4-4 6-9 6-16 0-8-2-16-6-22z" fill="#ef6157"/>
  <circle cx="110" cy="188" r="6.4" fill="#ffd166" stroke="#e2534f" stroke-width="1.6"/>

  <!-- 耳朵 -->
  <path d="M58 96C47 68 40 44 42 25c1-10 10-11 18-4 15 13 27 30 33 47z" fill="url(#furGray)"/>
  <path d="M162 96c11-28 18-52 16-71-1-10-10-11-18-4-15 13-27 30-33 47z" fill="url(#furGray)"/>
  <path d="M61 88c-7-20-11-35-11-47 0-4 2-5 6-2 9 8 17 19 22 31z" fill="#ffc7d1"/>
  <path d="M159 88c7-20 11-35 11-47 0-4-2-5-6-2-9 8-17 19-22 31z" fill="#ffc7d1"/>
  <path d="M50 40c4-6 9-8 14-8M170 40c-4-6-9-8-14-8" stroke="#eee9f8" stroke-width="2" stroke-linecap="round" opacity=".8"/>

  <!-- 头 -->
  <path d="M110 46c35 0 59 25 59 57 0 35-26 58-59 58s-59-23-59-58c0-32 24-57 59-57z" fill="url(#fur)"/>
  <!-- 哈士奇面具 -->
  <path d="M110 46c35 0 59 25 59 57 0 7-1 13-3 19-10-6-15-17-21-27-7-12-17-17-25-27-6-8-8-15-10-22z" fill="url(#furGray)" opacity=".95"/>
  <path d="M110 46c-13 0-25 4-35 11 6 7 12 9 18 13 7 5 10 11 17 11 7 0 11-6 17-11 6-4 12-6 18-13-10-7-22-11-35-11z" fill="url(#furGray)" opacity=".95"/>
  <path d="M105 48c2-13 8-19 17-21-5 7-7 13-7 19z" fill="#aaa7bc"/>

  <!-- 眼睛 -->
  <g class="eyes">
    <ellipse cx="84" cy="107" rx="19" ry="21" fill="#fff"/>
    <ellipse cx="136" cy="107" rx="19" ry="21" fill="#fff"/>
    <circle cx="85" cy="108" r="14" fill="url(#iris)"/>
    <circle cx="135" cy="108" r="14" fill="url(#iris)"/>
    <circle cx="85" cy="109" r="6.2" fill="#101d33"/>
    <circle cx="135" cy="109" r="6.2" fill="#101d33"/>
    <circle cx="80" cy="102" r="4.8" fill="#fff" opacity=".96"/>
    <circle cx="130" cy="102" r="4.8" fill="#fff" opacity=".96"/>
    <circle cx="89.5" cy="115" r="2.2" fill="#fff" opacity=".55"/>
    <circle cx="139.5" cy="115" r="2.2" fill="#fff" opacity=".55"/>
  </g>
  <ellipse cx="64" cy="127" rx="10" ry="6" fill="#ff9fb4" opacity=".42" filter="url(#soft)"/>
  <ellipse cx="156" cy="127" rx="10" ry="6" fill="#ff9fb4" opacity=".42" filter="url(#soft)"/>

  <!-- 鼻嘴 -->
  <path d="M110 124c3.5 0 6.2 2.7 6.2 5.5 0 3-2.9 5.4-6.2 5.4s-6.2-2.4-6.2-5.4c0-2.8 2.7-5.5 6.2-5.5z" fill="url(#nose)"/>
  <path d="M110 135v3.6" stroke="#c98a9b" stroke-width="1.8" stroke-linecap="round"/>
  <g class="mouth">
    <path d="M110 138.6c-2 6-9.4 8-13.4 3M110 138.6c2 6 9.4 8 13.4 3" fill="none" stroke="#c98a9b" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M102 143c2 5 5.6 7 8 7s6-2 8-7z" fill="#e8738f" opacity=".92"/>
  </g>
  <path d="M56 119h17M56 129h19M147 119h17M145 129h19" stroke="#d3cce2" stroke-width="1.7" stroke-linecap="round" opacity=".9"/>

  <!-- 眼镜 -->
  <g class="glasses">
    <circle cx="84" cy="107" r="25.5" fill="url(#lens)" opacity=".5"/>
    <circle cx="136" cy="107" r="25.5" fill="url(#lens)" opacity=".5"/>
    <circle cx="84" cy="107" r="25.5" fill="none" stroke="#2b2733" stroke-width="5.6"/>
    <circle cx="136" cy="107" r="25.5" fill="none" stroke="#2b2733" stroke-width="5.6"/>
    <path d="M109 105c-2.6-3.2-4.4-3.2-6.4 0M109 105c2.6-3.2 4.4-3.2 6.4 0" fill="none" stroke="#2b2733" stroke-width="5" stroke-linecap="round"/>
    <path d="M58 100c-6-2-11 0-13 4M162 100c6-2 11 0 13 4" fill="none" stroke="#2b2733" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M66 93c6-6 14-8 22-7" stroke="rgba(255,255,255,.78)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M118 93c6-6 14-8 22-7" stroke="rgba(255,255,255,.5)" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </g>
</svg></div>
    </div>
  </div>
  <div class="foot"><span>谱面由音频分析生成</span><span>·</span><span>手机竖屏 / 横屏 / 手柄</span></div>
  <div class="badge">免费开玩</div>
  <div class="glowline"></div>
  <div class="vign" style="background:radial-gradient(78% 74% at 50% 46%,transparent 48%,rgba(0,0,0,.55) 100%)"></div>
</body></html>
